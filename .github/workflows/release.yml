name: Release gem

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'eval/nero'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Set up
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            index.rubygems.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: ruby

      # Read version from version.rb
      - name: Get version
        id: version
        run: |
          version=$(ruby -r ./lib/nero/version -e 'puts Nero::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Release
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2

      # Job Summary
      - name: Summary
        run: |
          version="${{ steps.version.outputs.version }}"
          version_anchor="${version//./}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🔥 Nero ${version}

          - **RubyGems**: https://rubygems.org/gems/nero/versions/${version}
          - **Changelog**: https://github.com/eval/nero/blob/main/CHANGELOG.md#${version_anchor}
          - **Attestation**: \`gem fetch nero -v ${version} && gh attestation verify nero-${version}.gem --owner eval\`
          EOF

      # GH Attestations
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.gem

      # GH Release
      - name: Create GitHub release
        run: |
          version="${{ steps.version.outputs.version }}"
          dot_count=$(echo "$version" | tr -cd '.' | wc -c)

          read -r -d '' notes <<EOF || true
          ## 🔥 Nero ${version}
          Declarative YAML-tags

          **Rubygems**: https://rubygems.org/gems/nero/versions/${version}
          **Changelog**: https://github.com/eval/nero/blob/main/CHANGELOG.md#${version//./}
          EOF

          # The release belongs to the tag that triggered this run (e.g. v0.7.0). A bare
          # "$version" isn't a tag, and gh would create one on the default branch.
          tag="${GITHUB_REF_NAME}"
          if [[ "$dot_count" -gt 2 ]]; then
            gh release create "$tag" --verify-tag --title "$version" --prerelease --generate-notes
          else
            gh release create "$tag" --verify-tag --title "$version" --generate-notes --notes "$notes"
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
