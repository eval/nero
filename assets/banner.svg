  <text x="354" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#f0b98a">Declarative YAML-tags</text>
  <text x="354" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#b89480">env-vars, coercion, refs and more</text>

  <!-- sample config -->
  <g transform="translate(728 78)">
    <rect width="516" height="226" rx="14" fill="#120c09" fill-opacity="0.75" stroke="#4a2f22"/>
    <circle cx="26" cy="24" r="6" fill="#e2381b"/>
    <circle cx="46" cy="24" r="6" fill="#ff8a1f"/>
    <circle cx="66" cy="24" r="6" fill="#ffd76e"/>
    <text x="100" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', monospace" font-size="15" fill="#8a6c5c">config/app.yml</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', monospace" font-size="21" xml:space="preserve">
      <text x="26" y="80" fill="#f4e6d8">production:</text>
      <text x="26" y="116" fill="#f4e6d8">  secret: <tspan fill="#ff9a3c">!env</tspan> SECRET</text>
      <text x="26" y="152" fill="#f4e6d8">  port:   <tspan fill="#ff9a3c">!env/integer</tspan> [PORT, 3000]</text>
      <text x="26" y="188" fill="#f4e6d8">  admins: <tspan fill="#ff9a3c">!ip</tspan> 10.0.0.0/8</text>
    </g>
